#configure of client registered with registry service
eureka:
  instance:
    prefer-ip-address: true  #if it is true then guessing and it will use the server ip address
  client:
    fetch-registry: true #it will fetch the registory of the server with eureka server
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

